  country_code: NA
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 精选速度
  - ♻️ 自动测速
  - DIRECT
  - 🇩🇪 DE 🇩🇪DE-https15
  - 🇿🇦 ZA 🇺🇸US-https1|T#163
  - 🇴🇲 OM 🇺🇸US-https1|T#185
  - 🇳🇦 NA NA-https1
- name: ⚡ 精选速度
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - 🇩🇪 DE 🇩🇪DE-https15
  - 🇿🇦 ZA 🇺🇸US-https1|T#163
  - 🇴🇲 OM 🇺🇸US-https1|T#185
  - 🇳🇦 NA NA-https1
- name: ♻️ 自动测速
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - 🇩🇪 DE 🇩🇪DE-https15
  - 🇿🇦 ZA 🇺🇸US-https1|T#163
  - 🇴🇲 OM 🇺🇸US-https1|T#185
  - 🇳🇦 NA NA-https1
- name: 🤖 ChatGPT
  type: select
  proxies:
  - DIRECT
- name: ▶️ YouTube
  type: select
  proxies:
  - DIRECT
- name: 🌐 落地分流
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
rules:
- DOMAIN-SUFFIX,muse.ai,🚀 节点选择
- DOMAIN-SUFFIX,muse-ai.onfast.space,🚀 节点选择
- DOMAIN-SUFFIX,onfast.space,🚀 节点选择
- GEOSITE,private,DIRECT
- GEOSITE,cn,DIRECT
- GEOIP,private,DIRECT
- GEOIP,cn,DIRECT
- GEOSITE,openai,🤖 ChatGPT
- GEOSITE,category-ads-all,REJECT
- MATCH,🚀 节点选择
geodata-mode: true
geo-auto-update: true
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://cdn.jsdelivr.net/gh/xishang0128/bgp@latest/IP2ASN/IP2ASN.yaml
