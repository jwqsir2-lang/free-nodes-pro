mixed-port: 7890
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090
ipv6: false
proxies:
- name: 🇩🇪 DE 🇩🇪DE-https15
  type: http
  server: 91.64.164.126
  port: 443
  udp: false
  tls: true
  skip_cert_verify: true
  servername: 91.64.164.126
  iptype: jk
  country_code: DE
- name: 🇿🇦 ZA 🇺🇸US-https1|T#163
  type: http
  server: 198.54.223.176
  port: 443
  udp: false
  tls: true
  skip_cert_verify: true
  servername: 198.54.223.176
  iptype: jk
  country_code: ZA
- name: 🇴🇲 OM 🇺🇸US-https1|T#185
  type: http
  server: 134.0.214.206
  port: 443
  udp: false
  tls: true
